<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UpOK · 我的应用</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><div><strong>UpOK</strong><span class="tag">本地</span></div><small>内部试验版 · Trial 不等于正式 Free</small></header><section class="heading"><h1>我的应用</h1><button id="add">添加应用</button></section><p id="message" role="status" aria-live="polite"></p><section id="projects" aria-label="应用列表"></section><footer>资源运行在你的云账号中。关闭页面不取消本地进程中的操作；退出工具后，可核对云端进度再继续。</footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><button id="close">关闭</button></dialog>
<template id="card"><article><div class="title-row"><div><h2 class="name"></h2><p class="plan"></p></div><span class="status tag"></span></div><p class="address"></p><div class="actions"><a class="visit button" target="_blank" rel="noopener noreferrer">打开应用</a><button data-action="logs">查看日志</button><button data-action="publish" class="primary">发布更新</button></div><p class="operation" role="status"></p><div class="recovery" hidden><button data-action="reconcile">核对上次操作</button></div><details><summary>应用详情</summary><dl><dt>状态更新</dt><dd class="observed"></dd><dt>数据库</dt><dd class="database"></dd><dt>最近访问检查</dt><dd class="checked"></dd><dt>项目授权</dt><dd class="authorization"></dd></dl><div class="actions"><button data-action="refresh">刷新资源状态</button><button data-action="check">检查应用访问</button></div></details></article></template>
</body></html>
